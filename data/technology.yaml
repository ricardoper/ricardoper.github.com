# One block per position, newest first.
#   start / end   "YYYY-MM" (or "YYYY"); `current: true` shows "Present" instead of `end`
#   role, about, details, org   plain string, or a map with one entry per language (en / es / pt)
#   about         HTML allowed
#   facts         "label: text" bullets; `key` is an i18n key (technologies_used, hardware_used)
#   groups        alternative to details/facts: bullets under several headings (`title` is an i18n key)

