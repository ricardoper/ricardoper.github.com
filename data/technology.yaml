- org: Netex Learning
  logo: netex-learning.png
  role:
    en: Software Architect
    es: Arquitecto de Software
    pt: Arquiteto de Software
  start: "2020-12"
  end: "2022-05"
  about:
    en: "<strong>Netex Learning</strong> creates applications and services for training in companies and educational institutions, with the technology and innovation that make up its DNA."
    es: "<strong>Netex Learning</strong> crea aplicaciones y servicios para la formación en empresas e instituciones educativas con la tecnología y la innovación que conforma su ADN."
    pt: "<strong>Netex Learning</strong> cria aplicações e serviços para a formação em empresas e instituições de ensino, com a tecnologia e a inovação que fazem parte do seu ADN."
  details:
    - en: "Head of the Architecture department."
      es: "Responsable del departamento de Arquitectura."
      pt: "Responsável pelo departamento de Arquitetura."
    - en: "Responsible for the entire AWS Cloud architecture and all the cross-cutting components used by every team involved. Driving new technologies, solutions and best practices across all teams. Administrator of the AWS organisation."
      es: "Responsable de toda la Arquitectura de la Nube de AWS y todos los componentes transversales utilizados por todos los equipos involucrados. Impulsor de nuevas tecnologías, soluciones y mejores prácticas a todos los equipos. Administrador de la organización AWS."
      pt: "Responsável por toda a arquitetura da Cloud AWS e por todos os componentes transversais utilizados por todas as equipas envolvidas. Impulsionador de novas tecnologias, soluções e boas práticas junto de todas as equipas. Administrador da organização AWS."
