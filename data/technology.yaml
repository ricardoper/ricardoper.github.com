- org: BEONPRICE
  logo: beonprice.png
  role:
    en: "Software & Systems Architect"
    es: "Arquitecto de Software & Sistemas"
    pt: "Arquiteto de Software & Sistemas"
  start: "2014-01"
  end: "2018-12"
  about:
    en: "<strong>BEONPRICE</strong> is a global leader in an Artificial Intelligence-based Revenue Optimisation solution that maximises hotel revenue."
    es: "<strong>BEONPRICE</strong> es líder global de una solución de Optimización de Revenue basada en Inteligencia Artificial para maximizar los ingresos del hotel."
    pt: "<strong>BEONPRICE</strong> é líder global de uma solução de Otimização de Revenue baseada em Inteligência Artificial para maximizar as receitas do hotel."
  details:
    - en: "Team Lead of the Architecture department."
      es: "Jefe de equipo del departamento de Arquitectura."
      pt: "Chefe de equipa do departamento de Arquitetura."
    - en: "Creator of, and responsible for, the whole design and roll-out of the current architectures, which are built around scalable, distributed, highly available (micro)services with autohealing, autoregister and autowakeup systems for outages, made up of more than 250 VMs across multiple providers. Event-driven architectures combining multiple programming languages and multiple databases, with intelligent data-processing systems backed by Big Data technologies."
      es: "Creador y responsable de todo el diseño y puesta en marcha de las arquitecturas actuales que están orientadas a (µ)servicios escalables, distribuidos, de alta disponibilidad, con sistemas de autohealing, autoregister, autowakeup en caídas y compuestos por más de 250 VM's en múltiples proveedores. Arquitecturas orientadas a eventos, compuestas por multi lenguajes de programación, multi base de datos, con sistemas de procesado inteligente de datos apoyados por tecnologías BigData."
      pt: "Criador e responsável por todo o desenho e colocação em produção das arquiteturas atuais, orientadas para (µ)serviços escaláveis, distribuídos e de alta disponibilidade, com sistemas de autohealing, autoregister e autowakeup em caso de falhas, compostas por mais de 250 VMs em múltiplos fornecedores. Arquiteturas orientadas a eventos, compostas por várias linguagens de programação e várias bases de dados, com sistemas de processamento inteligente de dados apoiados em tecnologias Big Data."
  facts:
    - key: technologies_used
      text: "PHP, Python, Golang, Laravel, Symfony, Amazon Web Services, Google Cloud Platform, Microsoft Azure, MongoDB & DocumentDB, Redis & ElastiCache, Elastic, RabbitMQ & SQS, Apache Kafka, Nginx, Apache HTTP, Pentaho, Beanstalkd, Linux Ubuntu, CentOS, Fedora."

