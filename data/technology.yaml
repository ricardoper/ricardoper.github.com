      text: "Amazon Web Services, Organizations, RDS, ElastiCache (Redis), AmazonMQ (RabbitMQ), SQS/SNS, Cloudfront, S3, ..., PHP, Java, Linux Ubuntu, Debian."

- org: Cerberu
