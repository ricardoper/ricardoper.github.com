about_title: "Sobre mim"
about_1: "Um programador incansável que procura diariamente a excelência para desenvolver aplicações de qualidade. Atento aos pequenos detalhes e com um forte gosto pela otimização, para conseguir dar algo mais com a mesma infraestrutura. A experiência em várias áreas faz dele um programador completo, eficaz e com uma visão ampla de um projeto em qualquer das suas fases, bem como das infraestruturas ou tecnologias a utilizar."
about_2: "Com experiência em desenhar sistemas distribuídos e escaláveis que gerem vários terabytes de informação diariamente, em implementar sistemas de mensagens em streaming distribuídas, em bases de dados documentais, colunares, chave-valor e relacionais, em motores de pesquisa, em instalações de servidores empresariais de raiz e toda a rede envolvente, em sistemas de Cloud Computing (IaaS, PaaS, SaaS e FaaS) e em sistemas automatizados de cópias de segurança de servidores."

