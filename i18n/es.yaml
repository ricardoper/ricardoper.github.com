about_title: "Sobre mí"
about_1: "Un programador incansable que diariamente busca la excelencia para desarrollar aplicaciones de calidad. Atento a los pequeños detalles y con un gusto elevado por la optimización, para poder dar algo más con la misma infraestructura. Con experiencia en varias áreas, hace de él un programador completo, eficaz y con una visión amplia de un proyecto en cualquiera de sus fases y las infraestructuras o tecnologías a utilizar."
about_2: "Con experiencia en diseñar sistemas distribuidos y escalables que gestionan varios terabytes de información diariamente, en implementar sistemas de mensajes streaming distribuidos, en base de datos documentales, columnares, clave-valor y relacionales, en motores de búsquedas, en instalaciones de servidores empresariales desde cero y toda su red envolvente, en sistemas de Cloud Computing (IaaS, PaaS, SaaS &amp; FaaS) y en sistemas automatizados de backup's de servidores."

