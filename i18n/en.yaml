about_title: "About me"
about_1: "A tireless developer who strives for excellence every day to build high-quality applications. Attentive to the small details and with a strong taste for optimisation, to get more out of the same infrastructure. Experience across several areas makes for a complete, effective developer with a broad view of a project in any of its phases and of the infrastructure or technologies to use."
about_2: "Experienced in designing distributed, scalable systems that handle several terabytes of data every day; in implementing distributed message-streaming systems; in document, columnar, key-value and relational databases; in search engines; in setting up enterprise servers from scratch along with all the surrounding network; in Cloud Computing systems (IaaS, PaaS, SaaS &amp; FaaS); and in automated server backup systems."

