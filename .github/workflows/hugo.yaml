# Build the site with Hugo and publish it to GitHub Pages.
#
#   push to main/master  -> build + deploy
#   pull request         -> build only (checks that the site still compiles)
#   "Run workflow" button -> build + deploy (Actions tab)
#
# One-time setup: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# The Hugo version comes from .hugo-version (the Makefile reads the same file).
# Run the same build locally with:  make build

name: Build and deploy site

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: read the repo, write only what Pages needs
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build: compile the site into ./public
  # ---------------------------------------------------------------------------
  build:
    name: Build with Hugo
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      TZ: Europe/Madrid
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read the Hugo version from .hugo-version
        run: echo "HUGO_VERSION=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_ENV"

      - name: Install Hugo
        run: |
          wget -q -O "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build the site
        run: hugo --gc --minify

      - name: Check the build output
        run: |
          for page in index.html es/index.html pt/index.html sitemap.xml; do
            test -s "public/$page" || { echo "::error::public/$page is missing or empty"; exit 1; }
          done

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # ---------------------------------------------------------------------------
  # 2. Deploy: publish the artifact (skipped on pull requests)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
